appId: 'xyz.districtrp.launcher'
productName: 'DistrictRP Launcher'
artifactName: 'DistrictRP-Launcher-setup-${version}.${ext}'

copyright: 'Copyright © 2026 DistrictRP (based on Helios Launcher by Daniel Scalzi)'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'DistrictRP-Launcher-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'DistrictRP'
  vendor: 'DistrictRP'
  synopsis: 'DistrictRP Minecraft Launcher'
  description: 'Launcher which allows users to join the DistrictRP modded server. All mods, configurations, and updates are handled automatically.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'